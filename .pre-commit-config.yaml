# .pre-commit-config.yaml
# Run with prek: https://github.com/j178/prek
# Install: prek install
# Run:     prek run --all-files
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        name: Detect secrets with Gitleaks
        description: Scan for hardcoded secrets, API keys, passwords, and tokens
        args: [--redact, --staged, --exit-code=1]
        exclude: '\.secrets\.baseline$'
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: Detect secrets with detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: '\.env\.template|\.githooks/pre-commit'
  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
        name: Format YAML files with yamlfmt
  - repo: local
    hooks:
      - id: no-env-file
        name: Prevent committing .env files
        entry: bash -c 'if git diff --cached --name-only | grep -qE "^\.env(\..*)?$" | grep -v "template"; then echo "❌ Do not commit .env files"; exit 1; fi; exit 0'
        language: system
        types: [text]
        pass_filenames: false
        always_run: true
