apiVersion: v1
kind: ConfigMap
metadata:
  name: servarr-wire-script
  labels:
    app.kubernetes.io/name: servarr-wire
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  wire-services.py: |-
{{ .Files.Get "files/wire-services.py" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: servarr-wire-job
  labels:
    app.kubernetes.io/name: servarr-wire
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: servarr-wire
    spec:
      restartPolicy: OnFailure
      containers:
        - name: wire
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python3
            - /scripts/wire-services.py
          envFrom:
            - secretRef:
                name: servarr-secrets
          volumeMounts:
            - name: script-vol
              mountPath: /scripts
            - name: jellyfin-config
              mountPath: /config
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: script-vol
          configMap:
            name: servarr-wire-script
            defaultMode: 0755
        - name: jellyfin-config
          persistentVolumeClaim:
            claimName: jellyfin-config
