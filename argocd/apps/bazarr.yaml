apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taiflix-bazarr
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: "https://github.com/your-username/taiflix.git"
    targetRevision: HEAD
    path: charts/servarr-app
    helm:
      valuesObject:
        appName: "bazarr"
        image:
          repository: "lscr.io/linuxserver/bazarr"
          tag: "latest"
        service:
          port: 6767
        secretKeyRef:
          secretName: "servarr-secrets"
          apiKeyEnvVar: "BAZARR_API_KEY"
        initSeedConfig:
          enabled: true
          port: 6767
          authMethod: "Forms"
        ingress:
          enabled: true
          host: "bazarr.taiflix.lan"
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
