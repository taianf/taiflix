# .yamllint.yaml configuration for Kubernetes & Helm
extends: default

rules:
  line-length:
    max: 180
    level: warning
  truthy:
    level: warning
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  document-start: disable
  braces:
    max-spaces-inside: 1
  brackets:
    max-spaces-inside: 1

ignore: |
  charts/*/templates/
  .git/
  .venv/
